name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: x64
          - runner: macos-15-arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取版本号
        id: ver
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 准备图标
        run: python packaging/make-icons.py --check || python packaging/make-icons.py
      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成 DMG
        run: packaging/build-dmg.sh --out "dist/QuickSwitch-${{ steps.ver.outputs.version }}-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 准备图标
        shell: bash
        run: python packaging/make-icons.py --check || python packaging/make-icons.py
      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成安装包（NSIS）
        shell: bash
        run: |
          choco install nsis --no-progress -y
          "/c/Program Files (x86)/NSIS/makensis.exe" "/DVERSION=${{ steps.ver.outputs.version }}" packaging/installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成 SHA256 校验文件
        run: |
          cd artifacts
          find . -type f -not -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: QuickSwitch ${{ github.ref_name }}
          files: |
            artifacts/**/*
            INSTALL.md
          generate_release_notes: true
          fail_on_unmatched_files: true
