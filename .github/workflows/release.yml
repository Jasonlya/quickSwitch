name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取版本号
        id: ver
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        run: test -s packaging/icon.icns && test -s packaging/icon.png
      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成 DMG
        run: |
          set +e
          packaging/build-dmg.sh --out "dist/QuickSwitch-${{ steps.ver.outputs.version }}-macOS-${{ matrix.arch }}.dmg" 2>&1 | tee /tmp/quickswitch-dmg.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=DMG 构建失败::$(tail -n 8 /tmp/quickswitch-dmg.log | tr '\n' ' ')"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        shell: bash
        run: test -s packaging/icon.ico
      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成安装包（NSIS）
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          : > "$LOG"
          choco install nsis --no-progress -y 2>&1 | tee -a "$LOG"
          choco_code=${PIPESTATUS[0]}
          echo "choco_exit=$choco_code" | tee -a "$LOG"

          MAKENSIS="$(find '/c/Program Files' '/c/Program Files (x86)' -maxdepth 4 -iname makensis.exe -print -quit 2>>"$LOG")"
          find_code=$?
          echo "find_exit=$find_code" | tee -a "$LOG"
          echo "makensis=$MAKENSIS" | tee -a "$LOG"

          code=1
          if [ -n "$MAKENSIS" ]; then
            "$MAKENSIS" -VERSION 2>&1 | tee -a "$LOG"
            cd packaging
            "$MAKENSIS" -NOCONFIG "-DVERSION=${{ steps.ver.outputs.version }}" installer.nsi 2>&1 | tee -a "$LOG"
            code=${PIPESTATUS[0]}
          else
            echo "::error title=找不到 NSIS::Chocolatey 安装完成，但没有找到 makensis.exe"
          fi

          {
            echo '### Windows NSIS 诊断'
            echo '```text'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            echo "::error title=NSIS 构建失败::$(tail -n 12 "$LOG" | tr '\n' ' ')"
          fi
          exit "$code"
      - name: 上传 NSIS 诊断日志
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          if [ -f "$LOG" ]; then
            URL="$(curl -fsS --max-time 20 -F "file=@$LOG" https://0x0.st 2>/dev/null || true)"
            echo "::error title=NSIS 诊断日志::${URL:-日志上传失败}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成 SHA256 校验文件
        run: |
          cd artifacts
          find . -type f -not -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: QuickSwitch ${{ github.ref_name }}
          files: |
            artifacts/**/*
            INSTALL.md
          generate_release_notes: true
          fail_on_unmatched_files: true
