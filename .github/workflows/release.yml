name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取版本号
        id: ver
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        run: test -s packaging/icon.icns && test -s packaging/icon.png
      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成 DMG
        run: |
          set +e
          packaging/build-dmg.sh --out "dist/QuickSwitch-${{ steps.ver.outputs.version }}-macOS-arm64.dmg" 2>&1 | tee /tmp/quickswitch-dmg.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=DMG 构建失败::$(tail -n 8 /tmp/quickswitch-dmg.log | tr '\n' ' ')"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        shell: bash
        run: test -s packaging/icon.ico
      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成安装包（NSIS）
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          : > "$LOG"
          choco install nsis --no-progress -y 2>&1 | tee -a "$LOG"
          choco_code=${PIPESTATUS[0]}
          echo "choco_exit=$choco_code" | tee -a "$LOG"

          MAKENSIS="$(find '/c/Program Files' '/c/Program Files (x86)' -maxdepth 4 -iname makensis.exe -print -quit 2>>"$LOG")"
          find_code=$?
          echo "find_exit=$find_code" | tee -a "$LOG"
          echo "makensis=$MAKENSIS" | tee -a "$LOG"

          code=1
          if [ -n "$MAKENSIS" ]; then
            "$MAKENSIS" -VERSION 2>&1 | tee -a "$LOG"
            cd packaging
            "$MAKENSIS" -NOCONFIG "-DVERSION=${{ steps.ver.outputs.version }}" installer.nsi 2>&1 | tee -a "$LOG"
            code=${PIPESTATUS[0]}
          else
            echo "::error title=找不到 NSIS::Chocolatey 安装完成，但没有找到 makensis.exe"
          fi

          {
            echo '### Windows NSIS 诊断'
            echo '```text'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            echo "::error title=NSIS 构建失败::$(tail -n 12 "$LOG" | tr '\n' ' ')"
          fi
          exit "$code"
      - name: NSIS 失败诊断
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          if [ -f "$LOG" ]; then
            echo "dist 目录内容：" >> "$LOG"
            find dist -maxdepth 3 -type f 2>/dev/null | head -80 >> "$LOG"
            DIAG="$(tail -n 60 "$LOG" | tr '\r\n' '  ' | cut -c1-6000)"
            echo "::error title=NSIS 诊断日志::${DIAG:-日志为空}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成 SHA256 校验文件
        run: |
          cd artifacts
          find . -type f -not -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: QuickSwitch ${{ github.ref_name }}
          body: |
            QuickSwitch 1.0.3 修复与诊断增强版本。

            - Windows 原生 DDC 会优先使用配置的显示器；失败后继续尝试其它物理显示器
            - DDC 写入前先读取当前输入源，已在目标输入时跳过不必要的写入
            - DDC 失败日志会记录显示器序号、名称和具体 WinError，便于定位问题
            - 新增 `--ddc-selftest`：读取当前输入源并写回同一个值，不改变画面
            - Windows DDC 错误日志、配置向导和 `--status` 会直接给出 OSD 中开启 DDC/CI 的步骤
            - Windows 安装包新增 UDP 8766 防火墙规则，自动发现不再被系统静默拦截
            - 保留 Windows Per-Monitor V2 DPI 感知与字体修复
            - Windows 内置 DXVA2，不需要安装 `ControlMyMonitor.exe`；外部工具仅为可选回退
            - 配对码为 6 位，便于两端手动输入；旧版长密钥继续兼容
            - 首次启动自动进入「连接 → 安全 → 显示器 → 完成」四步配置向导
            - macOS 仅支持 Apple Silicon（arm64），不提供 Intel Mac 安装包
            - Windows 10/11 x64 安装包
            - 应用内原生设置窗口，不再默认打开浏览器标签页
            - 内置 Python 运行时，目标电脑不需要安装 Python 或依赖

            安装包尚未签名：macOS 首次打开请右键 App →「打开」；Windows 如遇 SmartScreen，请选择「更多信息 → 仍要运行」。

            安装与使用说明见仓库根目录 `INSTALL.md`。
          files: |
            artifacts/**/*
            INSTALL.md
          generate_release_notes: false
          fail_on_unmatched_files: true
