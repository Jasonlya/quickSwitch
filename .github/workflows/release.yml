name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 单元测试
        shell: bash
        run: |
          set +e
          python scripts/run-tests.py --timeout 900 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python - "$RUNNER_TEMP/unit-tests.log" <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          blocks = re.split(r"^={70}\n", text, flags=re.MULTILINE)
          emitted = False
          for block in blocks:
              match = re.match(r"^(FAIL|ERROR): (.+?)\n-+\n(.*)", block, re.DOTALL)
              if not match:
                  continue
              emitted = True
              title = f"{match.group(1)} {match.group(2)}"[:240]
              message = match.group(3).strip()[-6000:]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{message}")
          if not emitted:
              message = text.strip()[-6000:]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=测试日志::{message}")
          PY
          fi
          exit "$code"
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/unit-tests.log
          if-no-files-found: error

  macos:
    name: macOS DMG (arm64)
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 读取版本号
        id: ver
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        run: test -s packaging/icon.icns && test -s packaging/icon.png
      - name: 准备内置 Deskflow
        run: python3 packaging/fetch-deskflow.py --target macos-arm64 --if-missing
      - name: PyInstaller 打包
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 嵌入内置 Deskflow
        run: python3 packaging/bundle-deskflow.py --app dist/QuickSwitch.app
      - name: 验证内置 Deskflow
        run: |
          BUNDLED="$(find dist/QuickSwitch.app/Contents -type d -name Deskflow.app -print -quit)"
          test -n "$BUNDLED"
          codesign --verify --deep --strict "$BUNDLED"
          STATUS="$(dist/QuickSwitch.app/Contents/MacOS/QuickSwitch --deskflow-status)"
          echo "$STATUS"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["installed"] and d["bundled"] and not d["tls"]' <<<"$STATUS"
          echo "内置键鼠共享核心：$BUNDLED"
      - name: 生成 DMG
        run: |
          set +e
          packaging/build-dmg.sh --out "dist/QuickSwitch-${{ steps.ver.outputs.version }}-macOS-arm64.dmg" 2>&1 | tee /tmp/quickswitch-dmg.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=DMG 构建失败::$(tail -n 8 /tmp/quickswitch-dmg.log | tr '\n' ' ')"
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: 读取版本号
        id: ver
        shell: bash
        run: echo "version=$(python packaging/print-version.py)" >> "$GITHUB_OUTPUT"
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: 验证图标
        shell: bash
        run: test -s packaging/icon.ico
      - name: 准备内置 Deskflow
        shell: bash
        run: python packaging/fetch-deskflow.py --target windows-x64 --if-missing
      - name: PyInstaller 打包
        shell: bash
        run: pyinstaller --clean --noconfirm packaging/quickswitch.spec
      - name: 生成安装包（NSIS）
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          : > "$LOG"
          choco install nsis --no-progress -y 2>&1 | tee -a "$LOG"
          choco_code=${PIPESTATUS[0]}
          echo "choco_exit=$choco_code" | tee -a "$LOG"

          MAKENSIS="$(find '/c/Program Files' '/c/Program Files (x86)' -maxdepth 4 -iname makensis.exe -print -quit 2>>"$LOG")"
          find_code=$?
          echo "find_exit=$find_code" | tee -a "$LOG"
          echo "makensis=$MAKENSIS" | tee -a "$LOG"

          code=1
          if [ -n "$MAKENSIS" ]; then
            "$MAKENSIS" -VERSION 2>&1 | tee -a "$LOG"
            cd packaging
            "$MAKENSIS" -NOCONFIG "-DVERSION=${{ steps.ver.outputs.version }}" installer.nsi 2>&1 | tee -a "$LOG"
            code=${PIPESTATUS[0]}
          else
            echo "::error title=找不到 NSIS::Chocolatey 安装完成，但没有找到 makensis.exe"
          fi

          {
            echo '### Windows NSIS 诊断'
            echo '```text'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            echo "::error title=NSIS 构建失败::$(tail -n 12 "$LOG" | tr '\n' ' ')"
          fi
          exit "$code"
      - name: NSIS 失败诊断
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/quickswitch-nsis-debug.log"
          if [ -f "$LOG" ]; then
            echo "dist 目录内容：" >> "$LOG"
            find dist -maxdepth 3 -type f 2>/dev/null | head -80 >> "$LOG"
            DIAG="$(tail -n 60 "$LOG" | tr '\r\n' '  ' | cut -c1-6000)"
            echo "::error title=NSIS 诊断日志::${DIAG:-日志为空}"
          fi
      - name: 安装包验收（静默安装 / 启动 / 卸载）
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "找不到 Windows 安装包" }
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-diagnose')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 生成 SHA256 校验文件
        run: |
          cd artifacts
          find . -type f -not -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - name: 准备 Deskflow 对应源码
        run: |
          VERSION="$(python3 packaging/fetch-deskflow.py --print-version)"
          curl -fL --retry 3 -o "deskflow-${VERSION}-source.tar.gz" \
            "https://github.com/deskflow/deskflow/archive/refs/tags/v${VERSION}.tar.gz"
      # v3.0.4 修复了资产上传并发时 update-a-release-asset 的瞬时 404，
      # 并切换到 Node 24 Actions runtime。
      - uses: softprops/action-gh-release@v3.0.4
        with:
          name: QuickSwitch ${{ github.ref_name }}
          body: |
            QuickSwitch ${{ github.ref_name }}：修复 Windows 设置窗口在升级后仍打不开的问题，并补齐启动失败兜底。

            - Windows 安装器覆盖安装前自动结束旧版 QuickSwitch 与 `deskflow-core`，避免旧 exe 被占用、修复实际未生效
            - 设置窗口子进程启动后立即退出时自动回退到默认浏览器，不再出现点击「打开设置窗口」无响应
            - 官方 Deskflow 1.27.0 无界面核心直接内置，不再安装或打开 Deskflow 客户端
            - Windows 自动作为服务端，macOS 自动作为客户端，并自动发现对端地址
            - 自动生成键鼠共享配置，同步热键、端口、屏幕左右布局和剪贴板共享
            - QuickSwitch 启动/退出时自动管理核心进程，设置页和托盘可重启或停止
            - 主界面键鼠共享状态只在真实 TCP 已连接时显示「已连接」，失败会显示超时、拒绝或权限原因
            - Windows 安装包自动放行 TCP 24800；macOS App 内置官方 `Deskflow.app`
            - macOS 设置页提供辅助功能、输入监控和本地网络权限引导
            - 应用内原生设置窗口，保留 DDC 切换、6 位配对码、配置向导和 Windows DPI 修复
            - 内置 Python 运行时，目标电脑不需要安装 Python 或依赖
            - macOS 仅支持 Apple Silicon（arm64），Windows 支持 10/11 x64

            安装包尚未签名：macOS 首次打开请右键 App →「打开」；Windows 如遇 SmartScreen，请选择「更多信息 → 仍要运行」。

            安装与使用说明见仓库根目录 `INSTALL.md`。
          files: |
            artifacts/**/*
            INSTALL.md
            THIRD_PARTY_NOTICES.md
            deskflow-*-source.tar.gz
          generate_release_notes: false
          fail_on_unmatched_files: true
